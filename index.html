<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RainyGames — Free Online Games</title>

<meta name="description" content="Play free online games on RainyGames. Discover racing, arcade, puzzle, action, sports and more.">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div class="logo" onclick="goHome()">
        <span class="logo-mark">R</span>
        <span>RainyGames</span>
    </div>

    <div class="search-area">
        <input
            id="searchInput"
            type="search"
            placeholder="Search games..."
            oninput="searchGames()"
        >
    </div>

</header>


<main>

<section class="hero">

    <div class="hero-content">

        <div class="eyebrow">FEATURED GAME</div>

        <h1>RainyCrash</h1>

        <p>
            Drive, dodge traffic and survive for as long as possible.
            How high can you get your score?
        </p>

        <button onclick="openGame('rainy-crash')">
            Play RainyCrash
        </button>

    </div>

</section>


<section class="categories">

    <button onclick="showCategory('All')">All</button>
    <button onclick="showCategory('Racing')">Racing</button>
    <button onclick="showCategory('Arcade')">Arcade</button>
    <button onclick="showCategory('Puzzle')">Puzzle</button>
    <button onclick="showCategory('Action')">Action</button>
    <button onclick="showCategory('Platform')">Platform</button>

</section>


<section class="game-section">

    <div class="section-heading">
        <div>
            <p class="small-title">PLAY NOW</p>
            <h2>Popular Games</h2>
        </div>
    </div>

    <div id="gameGrid" class="game-grid"></div>

</section>


<section class="game-section">

    <div class="section-heading">
        <div>
            <p class="small-title">DRIVE</p>
            <h2>Popular Car Games</h2>
        </div>
    </div>

    <div id="carGrid" class="game-grid"></div>

</section>


<section class="game-section">

    <div class="section-heading">
        <div>
            <p class="small-title">QUICK PLAY</p>
            <h2>Quick Games</h2>
        </div>
    </div>

    <div id="quickGrid" class="game-grid"></div>

</section>


<section class="game-section">

    <div class="section-heading">
        <div>
            <p class="small-title">YOUR GAMES</p>
            <h2>Recently Played</h2>
        </div>
    </div>

    <div id="recentGrid" class="game-grid"></div>

</section>

</main>


<footer>

    <div class="footer-logo">RainyGames</div>

    <p>Play. Compete. Repeat.</p>

    <p class="copyright">
        © 2026 RainyGames
    </p>

</footer>


<script src="app.js"></script>

</body>
</html>
