<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RainyMusic</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #090909;
  color: white;
  min-height: 100vh;
  padding-bottom: 95px;
}

header {
  height: 70px;
  background: #111;
  display: flex;
  align-items: center;
  padding: 0 22px;
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid #222;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  margin-right: 25px;
}

.logo span {
  color: #1ed760;
}

.search {
  flex: 1;
  max-width: 500px;
}

.search input {
  width: 100%;
  background: #242424;
  border: none;
  outline: none;
  color: white;
  padding: 13px 18px;
  border-radius: 25px;
  font-size: 15px;
}

.search input::placeholder {
  color: #aaa;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 30px 22px;
}

.hero {
  background: linear-gradient(135deg, #202020, #101010);
  border-radius: 18px;
  padding: 35px;
  margin-bottom: 30px;
}

.hero h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

.hero p {
  color: #aaa;
  font-size: 16px;
}

.section-title {
  font-size: 23px;
  margin-bottom: 18px;
}

.songs {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.song {
  display: flex;
  align-items: center;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}

.song:hover {
  background: #1b1b1b;
}

.song.active {
  background: #181818;
}

.cover {
  width: 55px;
  height: 55px;
  border-radius: 6px;
  object-fit: cover;
  background: #292929;
  margin-right: 15px;
}

.song-info {
  flex: 1;
  min-width: 0;
}

.song-title {
  font-size: 16px;
  margin-bottom: 5px;
}

.artist {
  color: #999;
  font-size: 14px;
}

.song-duration {
  color: #888;
  margin-right: 15px;
}

.like {
  background: none;
  border: none;
  color: #777;
  font-size: 21px;
  cursor: pointer;
  padding: 8px;
}

.like.liked {
  color: #1ed760;
}

.empty {
  color: #777;
  text-align: center;
  padding: 35px;
  display: none;
}

/* PLAYER */

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 90px;
  background: #171717;
  border-top: 1px solid #292929;
  display: flex;
  align-items: center;
  padding: 10px 20px;
  z-index: 100;
}

.now-playing {
  width: 25%;
  display: flex;
  align-items: center;
  min-width: 180px;
}

.now-playing img {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border-radius: 5px;
  margin-right: 12px;
}

.now-title {
  font-size: 14px;
  font-weight: bold;
}

.now-artist {
  color: #999;
  font-size: 12px;
  margin-top: 5px;
}

.controls-area {
  flex: 1;
  max-width: 600px;
  margin: auto;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-bottom: 7px;
}

.control {
  border: none;
  background: none;
  color: white;
  cursor: pointer;
  font-size: 20px;
}

.play {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: white;
  color: black;
  font-size: 17px;
}

.progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.time {
  font-size: 10px;
  color: #999;
  width: 35px;
  text-align: center;
}

.progress {
  flex: 1;
  height: 4px;
  appearance: none;
  background: #555;
  border-radius: 10px;
  cursor: pointer;
}

.progress::-webkit-slider-thumb {
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: white;
}

.volume-area {
  width: 22%;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
}

.volume {
  width: 90px;
  appearance: none;
  height: 4px;
  background: #555;
  border-radius: 10px;
}

.volume::-webkit-slider-thumb {
  appearance: none;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: white;
}

@media (max-width: 700px) {

  header {
    padding: 0 15px;
  }

  .logo {
    font-size: 21px;
    margin-right: 12px;
  }

  .hero {
    padding: 25px;
  }

  .hero h1 {
    font-size: 31px;
  }

  .song-duration {
    display: none;
  }

  .player {
    height: 115px;
    padding: 8px 12px;
    flex-wrap: wrap;
  }

  .now-playing {
    width: 50%;
    min-width: 0;
    height: 50px;
  }

  .now-playing img {
    width: 45px;
    height: 45px;
  }

  .volume-area {
    width: 50%;
    height: 50px;
  }

  .controls-area {
    order: 3;
    width: 100%;
    max-width: none;
  }

  .controls {
    margin-bottom: 4px;
  }

  .volume {
    width: 70px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Rainy<span>Music</span></div>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="What do you want to play?"
      oninput="searchSongs()"
    >
  </div>
</header>

<main>

  <section class="hero">
    <h1>Your music. Your way.</h1>
    <p>Listen to your music collection with RainyMusic.</p>
  </section>

  <h2 class="section-title">Songs</h2>

  <div class="songs" id="songs"></div>

  <div class="empty" id="empty">
    No songs found 😭
  </div>

</main>

<!-- AUDIO ENGINE -->

<audio id="audio"></audio>

<!-- PLAYER -->

<div class="player">

  <div class="now-playing">
    <img id="nowCover" src="covers/default.jpg" alt="Album cover">

    <div>
      <div class="now-title" id="nowTitle">Nothing playing</div>
      <div class="now-artist" id="nowArtist">Choose a song</div>
    </div>
  </div>

  <div class="controls-area">

    <div class="controls">

      <button class="control" onclick="previousSong()">⏮</button>

      <button class="control play" id="playButton" onclick="togglePlay()">▶</button>

      <button class="control" onclick="nextSong()">⏭</button>

    </div>

    <div class="progress-row">

      <span class="time" id="currentTime">0:00</span>

      <input
        class="progress"
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        oninput="changeProgress()"
      >

      <span class="time" id="duration">0:00</span>

    </div>

  </div>

  <div class="volume-area">

    <span>🔊</span>

    <input
      class="volume"
      id="volume"
      type="range"
      min="0"
      max="1"
      value="0.8"
      step="0.01"
      oninput="changeVolume()"
    >

  </div>

</div>

<script>

/* =========================================
   YOUR SONG LIBRARY
   ========================================= */

const songs = [

  {
    title: "My First Song",
    artist: "RainyMusic",
    file: "music/song1.mp3",
    cover: "covers/cover1.jpg"
  },

  {
    title: "Summer",
    artist: "RainyMusic",
    file: "music/song2.mp3",
    cover: "covers/cover2.jpg"
  },

  {
    title: "Dreams",
    artist: "RainyMusic",
    file: "music/song3.mp3",
    cover: "covers/cover3.jpg"
  },

  {
    title: "Midnight",
    artist: "RainyMusic",
    file: "music/song4.mp3",
    cover: "covers/cover4.jpg"
  }

];


/* =========================================
   PLAYER VARIABLES
   ========================================= */

const audio = document.getElementById("audio");

let currentSong = -1;
let playing = false;


/* =========================================
   DISPLAY SONGS
   ========================================= */

function displaySongs(list = songs) {

  const container = document.getElementById("songs");

  container.innerHTML = "";

  if (list.length === 0) {
    document.getElementById("empty").style.display = "block";
    return;
  }

  document.getElementById("empty").style.display = "none";

  list.forEach((song) => {

    const realIndex = songs.indexOf(song);

    const row = document.createElement("div");

    row.className = "song";

    if (realIndex === currentSong) {
      row.classList.add("active");
    }

    row.innerHTML = `

      <img
        class="cover"
        src="${song.cover}"
        onerror="this.src='covers/default.jpg'"
      >

      <div class="song-info">

        <div class="song-title">
          ${song.title}
        </div>

        <div class="artist">
          ${song.artist}
        </div>

      </div>

      <div class="song-duration">
        —
      </div>

      <button
        class="like"
        onclick="likeSong(event, ${realIndex})"
        id="like-${realIndex}"
      >
        ♡
      </button>

    `;

    row.addEventListener("click", function() {
      loadSong(realIndex);
    });

    container.appendChild(row);

  });

}


/* =========================================
   LOAD SONG
   ========================================= */

function loadSong(index) {

  if (index < 0 || index >= songs.length) return;

  currentSong = index;

  const song = songs[index];

  audio.src = song.file;

  document.getElementById("nowTitle").textContent = song.title;

  document.getElementById("nowArtist").textContent = song.artist;

  document.getElementById("nowCover").src = song.cover;

  audio.volume = document.getElementById("volume").value;

  audio.play()
    .then(() => {
      playing = true;
      updatePlayButton();
    })
    .catch(() => {
      playing = false;
      updatePlayButton();
    });

  displaySongs();

}


/* =========================================
   PLAY / PAUSE
   ========================================= */

function togglePlay() {

  if (currentSong === -1) {

    loadSong(0);

    return;

  }

  if (audio.paused) {

    audio.play();

    playing = true;

  } else {

    audio.pause();

    playing = false;

  }

  updatePlayButton();

}


function updatePlayButton() {

  document.getElementById("playButton").textContent =
    audio.paused ? "▶" : "Ⅱ";

}


/* =========================================
   NEXT / PREVIOUS
   ========================================= */

function nextSong() {

  if (songs.length === 0) return;

  let next = currentSong + 1;

  if (next >= songs.length) {
    next = 0;
  }

  loadSong(next);

}


function previousSong() {

  if (songs.length === 0) return;

  if (audio.currentTime > 3) {

    audio.currentTime = 0;

    return;

  }

  let previous = currentSong - 1;

  if (previous < 0) {
    previous = songs.length - 1;
  }

  loadSong(previous);

}


/* =========================================
   AUTO NEXT SONG
   ========================================= */

audio.addEventListener("ended", function() {

  nextSong();

});


/* =========================================
   PROGRESS BAR
   ========================================= */

audio.addEventListener("timeupdate", function() {

  if (!audio.duration) return;

  const percentage =
    (audio.currentTime / audio.duration) * 100;

  document.getElementById("progress").value = percentage;

  document.getElementById("currentTime").textContent =
    formatTime(audio.currentTime);

  document.getElementById("duration").textContent =
    formatTime(audio.duration);

});


function changeProgress() {

  if (!audio.duration) return;

  const percentage =
    document.getElementById("progress").value;

  audio.currentTime =
    (percentage / 100) * audio.duration;

}


function formatTime(seconds) {

  if (isNaN(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);

  const secs = Math.floor(seconds % 60)
    .toString()
    .padStart(2, "0");

  return `${minutes}:${secs}`;

}


/* =========================================
   VOLUME
   ========================================= */

function changeVolume() {

  audio.volume =
    document.getElementById("volume").value;

}


/* =========================================
   SEARCH
   ========================================= */

function searchSongs() {

  const query =
    document.getElementById("search").value
      .toLowerCase()
      .trim();

  const filtered = songs.filter(song =>

    song.title.toLowerCase().includes(query) ||

    song.artist.toLowerCase().includes(query)

  );

  displaySongs(filtered);

}


/* =========================================
   LIKES
   ========================================= */

function likeSong(event, index) {

  event.stopPropagation();

  const button =
    document.getElementById(`like-${index}`);

  const liked =
    button.classList.toggle("liked");

  button.textContent =
    liked ? "♥" : "♡";

}


/* =========================================
   START
   ========================================= */

displaySongs();

audio.volume = 0.8;

</script>

</body>
</html>
